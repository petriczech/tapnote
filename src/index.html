<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <title>Tapnote</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f6f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b10" media="(prefers-color-scheme: dark)" />
    <script>
      // Vzhled před prvním vykreslením (klíč a hodnoty jako core/theme/theme.ts)
      // Barvy stavového řádku pro světlý a tmavý režim jako bar v THEMES; Noir je výchozí v metách výše
      // Uložené noir, zrušené konfety i neznámá hodnota zůstávají bez atributu, tedy Noir
      var bars = {
        blue: ['#fbf9ff', '#121318'],
        paper: ['#f7f1e3', '#1d1a16'],
        graphite: ['#ffffff', '#0b0b0b'],
        white: ['#ffffff', '#0f0f11'],
        airy: ['#f7f8fb', '#111318'],
        notebook: ['#f5f0e6', '#1c1a17'],
      };
      try {
        var theme = localStorage.getItem('tapnote.theme');
        if (Object.prototype.hasOwnProperty.call(bars, theme)) {
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"][media*="light"]').content = bars[theme][0];
          document.querySelector('meta[name="theme-color"][media*="dark"]').content = bars[theme][1];
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <tn-root></tn-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
