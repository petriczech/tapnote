# Nasazení PWA na GitHub Pages (https://petriczech.github.io/tapnote/) po pushi na main
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng lint
      - run: npx ng test --watch=false
      # Aplikace běží v podsložce /tapnote/
      - run: npx ng build --base-href /tapnote/
      # Pages nezná routy aplikace, přímý odkaz (např. /tapnote/notes) dostane 404.html = aplikaci
      - run: cp dist/tapnote/browser/index.html dist/tapnote/browser/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/tapnote/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
